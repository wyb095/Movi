org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 enables built-in Kotlin by default, but this project still applies
# the explicit Kotlin plugin in Gradle scripts.
android.builtInKotlin=false
# Kotlin Android plugin integration in this project still expects the legacy
# Android DSL extension type exposed before AGP's new DSL became the default.
android.newDsl=false
